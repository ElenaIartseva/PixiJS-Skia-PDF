name: Build and Deploy

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Cache Skia build
              id: skia-cache
              uses: actions/cache@v4
              with:
                  path: .skia-build
                  key: skia-${{ hashFiles('scripts/build-canvaskit.sh') }}

            - name: Build canvaskit-wasm
              if: steps.skia-cache.outputs.cache-hit != 'true'
              run: bash scripts/build-canvaskit.sh

            - name: Restore CanvasKit public artifacts
              if: steps.skia-cache.outputs.cache-hit == 'true'
              run: |
                  mkdir -p public/canvaskit
                  cp .skia-build/out/wasm/canvaskit.js public/canvaskit/canvaskit-pdf.js
                  cp .skia-build/out/wasm/canvaskit.wasm public/canvaskit/canvaskit-pdf.wasm
                  cp .skia-build/out/wasm/canvaskit.js public/canvaskit/canvaskit.js
                  cp .skia-build/out/wasm/canvaskit.wasm public/canvaskit/canvaskit.wasm

            - name: Install dependencies
              run: npm ci

            - name: Build Next.js
              run: npm run build

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./out
